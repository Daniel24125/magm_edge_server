# Mosquitto Broker Configuration for Self-Hosted MQTT

# Default listener (MQTT over TCP)
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# WebSocket listener
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

# Allow anonymous access
allow_anonymous true

# Persistence
persistence true
# Save data to a local folder named 'mosquitto_data' in the current directory
persistence_location mosquitto_data/

# Logging
# Log to console/stdout so you can see errors in the terminal
log_dest stdout

# Options
connection_messages true
log_type error
log_type warning
log_type notice
log_type information
